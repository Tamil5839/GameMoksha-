<div style="font-family: Georgia, 'Times New Roman', serif; background: #f4e4c1; padding: 32px 16px; color: #3a2314;">
  <div style="max-width: 440px; margin: 0 auto; background: #fbf3df; border: 2px solid #c9982f; border-radius: 16px; padding: 28px 24px; text-align: center;">
    <p style="font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: #a8431f; margin: 0 0 8px;">Moksha Patam</p>
    <h1 style="font-size: 24px; margin: 0 0 16px;">Your path awaits</h1>
    <p style="font-size: 16px; line-height: 1.5; margin: 0 0 24px;">Tap the button to sign in and climb today's ladders.</p>
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
       style="display: inline-block; background: #c2412b; color: #fff8e7; text-decoration: none; font-size: 17px; padding: 14px 28px; border-radius: 999px;">
      Sign in to Moksha Patam
    </a>
    <p style="font-size: 14px; line-height: 1.5; margin: 24px 0 4px;">Link opened in a different app? Enter this code instead:</p>
    <p style="font-size: 28px; letter-spacing: 6px; font-weight: bold; margin: 0;">{{ .Token }}</p>
    <p style="font-size: 12px; color: #7a5a3a; margin: 24px 0 0;">If you didn't ask to sign in, you can ignore this email.</p>
  </div>
</div>
